<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Sanitiser</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="" width="20" height="20" />
    <h1>YouTube Sanitiser</h1>
  </header>

  <main>
    <div class="filter-row">
      <label class="filter-label" for="hideShorts">Hide Shorts</label>
      <label class="toggle">
        <input type="checkbox" id="hideShorts" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="filter-row">
      <label class="filter-label" for="hidePlaylists">Hide Playlists</label>
      <label class="toggle">
        <input type="checkbox" id="hidePlaylists" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="filter-row">
      <label class="filter-label" for="hideMixes">Hide Mixes</label>
      <label class="toggle">
        <input type="checkbox" id="hideMixes" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- A filter with options is a panel holding it and its options -->
    <div class="group">
      <div class="filter-row">
        <label class="filter-label" for="hideLiveStreams">Hide live streams</label>
        <label class="toggle">
          <input type="checkbox" id="hideLiveStreams" />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Sub-rows start hidden, so they don't flash before the settings load -->
      <div class="options">
        <div class="filter-row sub-row hidden" id="excludeSubscribedLiveRow">
          <label class="filter-label sub-label" for="excludeSubscribedLive">Keep subscribed channels</label>
          <label class="toggle">
            <input type="checkbox" id="excludeSubscribedLive" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="filter-row">
        <label class="filter-label" for="hideLowViews">Hide low view count</label>
        <label class="toggle">
          <input type="checkbox" id="hideLowViews" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="options">
        <div class="filter-row sub-row hidden" id="minViewsRow">
          <label class="filter-label sub-label" for="minViews">Minimum views</label>
          <input type="text" id="minViews" class="views-input" placeholder="10,000" inputmode="numeric" />
        </div>

        <div class="filter-row sub-row hidden" id="excludeSubscribedRow">
          <label class="filter-label sub-label" for="excludeSubscribed">Keep subscribed channels</label>
          <label class="toggle">
            <input type="checkbox" id="excludeSubscribed" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span id="build"></span>
    <a href="https://github.com/HaXrDEV/youtube-sanitiser" target="_blank">GitHub</a>
  </footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
