name: Release

# Every release goes to GitHub. It's also uploaded to the Chrome Web Store
# only while the repository variable PUBLISH_TO_CHROME_WEB_STORE is 'true'

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions are pinned to commit SHAs, since the upload step gets the
      # Chrome Web Store secrets and a moved tag could hand them to anyone
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      # Checked before anything is built or released, so a missing setting
      # can't leave a GitHub release that never reached the store
      - name: Check Chrome Web Store settings
        if: vars.PUBLISH_TO_CHROME_WEB_STORE == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        run: |
          for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository variable $name isn't set (Settings > Secrets and variables > Actions > Variables)"
              exit 1
            fi
          done

      # The same tests as checks.yml, so a release never ships what they'd catch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.7.0

      - name: Run tests
        run: node --test

      - name: Build extension ZIP
        run: sh .github/build-zip.sh

      # The same lint as checks.yml
      - name: Lint for Firefox
        run: npx --yes addons-linter@10.13.0 youtube-sanitiser.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: youtube-sanitiser.zip
          generate_release_notes: true

      # v7 uses the Chrome Web Store API v2, since Google turned off v1 on
      # 15 October 2026. The extension and publisher IDs are repository
      # variables rather than secrets, as they don't grant access on their own
      - name: Upload & publish to Chrome Web Store
        if: vars.PUBLISH_TO_CHROME_WEB_STORE == 'true'
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          extension-id: ${{ vars.CHROME_EXTENSION_ID }}
          publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
          file-path: youtube-sanitiser.zip
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
