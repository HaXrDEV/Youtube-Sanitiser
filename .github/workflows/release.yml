name: Release & Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions are pinned to commit SHAs, since the upload step gets the
      # Chrome Web Store secrets and a moved tag could hand them to anyone
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Build extension ZIP
        run: |
          zip -r youtube-sanitiser.zip \
            manifest.json \
            defaults.js \
            view-count.js \
            content.js \
            popup.html \
            popup.css \
            popup.js \
            icons/icon16.png \
            icons/icon48.png \
            icons/icon128.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: youtube-sanitiser.zip
          generate_release_notes: true

      - name: Upload & publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@4008e29e13c144d0f6725462cbd49b7c291b4928 # v5.0.0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          file-path: youtube-sanitiser.zip
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
