name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs, so a moved tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The view count tests use Node's built-in number formatting data, which
      # changes between Node versions, so the version is pinned
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.7.0

      - name: Run tests
        run: node --test

      # Lints the extension, packed as a ZIP, for anything Firefox or
      # addons.mozilla.org would reject
      - name: Lint for Firefox
        run: |
          sh .github/build-zip.sh
          npx --yes addons-linter@10.13.0 youtube-sanitiser.zip
